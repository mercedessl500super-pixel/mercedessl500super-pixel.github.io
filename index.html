<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidnightClubMods.xyz | Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { display: flex; background-color: #0D1117; color: #C9D1D9; min-height: 100vh; }
        
        /* Premium Sidebar Panel Navigation */
        .sidebar { width: 280px; background-color: #161B22; border-right: 1px solid #30363D; padding: 30px 20px; display: flex; flex-direction: column; }
        .logo { font-size: 20px; font-weight: bold; margin-bottom: 40px; color: #F0F6FC; display: flex; align-items: center; gap: 10px; }
        .nav-link { text-decoration: none; color: #8B949E; font-weight: 600; padding: 12px 15px; border-radius: 6px; margin-bottom: 8px; display: block; transition: all 0.2s; cursor: pointer; }
        .nav-link:hover, .nav-link.active { background-color: #21262D; color: #F0F6FC; }
        .nav-link.submit-highlight { background-color: #238636; color: #FFFFFF; text-align: center; margin-top: 10px; }
        .nav-link.submit-highlight:hover { background-color: #2EA44F; }
        
        /* Workspace Framework */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header-section { margin-bottom: 40px; border-bottom: 1px solid #30363D; padding-bottom: 20px; }
        .header-section h1 { font-size: 32px; font-weight: 800; color: #F0F6FC; margin-bottom: 8px; }
        .header-section p { color: #8B949E; font-size: 16px; }
        
        /* Grid Alignment Matrix */
        .mod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; margin-bottom: 50px; }
        .mod-card { background: #161B22; border: 1px solid #30363D; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s, box-shadow 0.2s; }
        .mod-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.5); border-color: #58A6FF; }
        
        .mod-info h3 { font-size: 19px; font-weight: 700; margin-bottom: 8px; color: #F0F6FC; }
        .mod-info p { font-size: 14px; color: #8B949E; line-height: 1.6; margin-bottom: 15px; }
        
        /* Dynamic Structural Metadata Labels */
        .badge-container { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
        .badge.game { background-color: #388BFD; color: #0D1117; }
        .badge.type { background-color: #21262D; color: #C9D1D9; border: 1px solid #30363D; }
        
        .author-tag { font-size: 13px; color: #8B949E; margin-bottom: 15px; font-style: italic; }
        .download-btn { display: inline-block; text-align: center; background-color: #21262D; color: #C9D1D9; font-weight: 700; font-size: 14px; text-decoration: none; padding: 12px 20px; border-radius: 6px; border: 1px solid #30363D; transition: all 0.2s; }
        .download-btn:hover { background-color: #30363D; color: #F0F6FC; border-color: #8B949E; }

        /* Dynamic Popup Form Styling */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #161B22; border: 1px solid #30363D; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; }
        .modal-content h2 { margin-bottom: 20px; color: #F0F6FC; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 14px; font-weight: 600; color: #C9D1D9; }
        .form-group input, .form-group select { background: #0D1117; border: 1px solid #30363D; padding: 10px; color: #F0F6FC; border-radius: 6px; font-size: 14px; }
        .form-group input:focus, .form-group select:focus { border-color: #58A6FF; outline: none; }
        .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn { padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; }
        .btn.cancel { background: #21262D; color: #C9D1D9; border: 1px solid #30363D; }
        .btn.submit { background: #238636; color: white; }
        .error-msg { color: #FF7B72; font-size: 12px; margin-top: 5px; display: none; }
    </style>
</head>
<body>

    <!-- Sidebar Menu Interface Component -->
    <div class="sidebar">
        <div class="logo">🚗 MC3Mods.xyz</div>
        <a class="nav-link active" onclick="closeModal()">All Modifications</a>
        <a class="nav-link submit-highlight" onclick="openModal()">Submit a Modification</a>
    </div>

    <!-- Main Dynamic Content Engine -->
    <div class="main-content">
        <div class="header-section">
            <h1>Midnight Club Mod Hub</h1>
            <p>Welcome to the community archive. Submit your layout tools, configuration scripts, and assets safely using the upload portal.</p>
        </div>

        <div class="mod-grid" id="modGrid"></div>
    </div>

    <!-- Mod Submission Modal Box Form -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <h2>Submit a Mod</h2>
            <div class="form-group">
                <label>Mod Title</label>
                <input type="text" id="modTitle" placeholder="e.g., MC3 HD Texture Pack">
            </div>
            <div class="form-group">
                <label>Target Game Title</label>
                <select id="modGame">
                    <option value="MC1">Midnight Club: Street Racing (MC1)</option>
                    <option value="MC2">Midnight Club II (MC2)</option>
                    <option value="MC3">Midnight Club 3: DUB Edition (MC3)</option>
                    <option value="MCLA">Midnight Club: Los Angeles (MCLA)</option>
                    <option value="MCLA Remix">MCLA Complete Edition / Remix</option>
                </select>
            </div>
            <div class="form-group">
                <label>Category Group</label>
                <select id="modCategory">
                    <option value="Mod">Mod</option>
                    <option value="Tools">Tools</option>
                    <option value="Save data">Save data</option>
                    <option value="textures">Textures</option>
                    <option value="Vehicles">Vehicles</option>
                    <option value="Music">Music</option>
                    <option value="Vinyl/Livery">Vinyl/Livery</option>
                    <option value="Guide">Guide</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>GitHub Pages Repository Download Link</label>
                <input type="text" id="modLink" placeholder="https://username.github.io/repo-name">
                <div class="error-msg" id="urlError">Security Alert: Only URLs running out of github.io endpoints are allowed!</div>
            </div>
            <div class="form-actions">
                <button class="btn cancel" onclick="closeModal()">Cancel</button>
                <button class="btn submit" onclick="submitModDataForm()">Generate Submission</button>
            </div>
        </div>
    </div>

    <script>
        // Automated configuration mapping parameters
        const GITHUB_USERNAME = "mercedessl500super-pixel";
        const REPO_NAME = "Midnight-Club";

        // Main Visual Database Array
        const modificationsData = [
          {
            title: "MC3 Dual-Layer ISO Asset Installer",
            game: "MC3",
            category: "Tools",
            author: "Max",
            description: "Custom Python utility to update TOC listings and perfectly patch assets.dat configurations without corrupting audio blocks.",
            downloadUrl: "https://github.com/mercedessl500super-pixel/Midnight-Club"
          }
        ];

        function renderGrid() {
            const container = document.getElementById('modGrid');
            container.innerHTML = modificationsData.map(mod => `
                <div class="mod-card">
                    <div class="mod-info">
                        <div class="badge-container">
                            <span class="badge game">${mod.game}</span>
                            <span class="badge type">${mod.category}</span>
                        </div>
                        <h3>${mod.title}</h3>
                        <div class="author-tag">Contributed by ${mod.author}</div>
                        <p>${mod.description}</p>
                    </div>
                    <a href="${mod.downloadUrl}" target="_blank" class="download-btn">View Repository</a>
                </div>
            `).join('');
        }

        function openModal() { document.getElementById('uploadModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('uploadModal').style.display = 'none'; }

        function submitModDataForm() {
            const title = document.getElementById('modTitle').value;
            const game = document.getElementById('modGame').value;
            const cat = document.getElementById('modCategory').value;
            const link = document.getElementById('modLink').value;
            const errorElement = document.getElementById('urlError');

            // Strict Security Match Check: Restricts values strictly to GitHub Pages domains
            const githubPagesPattern = /^https:\/\/[a-zA-Z0-9-]+\.github\.io\/?.*$/i;
            if (!githubPagesPattern.test(link)) {
                errorElement.style.display = 'block';
                return;
            }
            errorElement.style.display = 'none';

            if(!title || !link) {
                alert("Please complete all required listing values.");
                return;
            }

            // Encodes text parameters cleanly to generate a formatted GitHub Issue payload
            const issueTitle = encodeURIComponent(`Mod Submission: ${title}`);
            const issueBody = encodeURIComponent(
                `### New Modification Listing Request\n\n` +
                `* **Title:** ${title}\n` +
                `* **Game:** ${game}\n` +
                `* **Category:** ${cat}\n` +
                `* **Source Link:** ${link}\n\n` +
                `<!-- Copy the block below to your index.html modificationsData array -->\n` +
                `\`\`\`json\n` +
                `{\n` +
                `  "title": "${title}",\n` +
                `  "game": "${game}",\n` +
                `  "category": "${cat}",\n` +
                `  "author": "CommunityMember",\n` +
                `  "description": "Add custom description block here.",\n` +
                `  "downloadUrl": "${link}"\n` +
                `},\n` +
                `\`\`\``
            );

            // Opens the auto-generated ticket directly inside your repo workflow window
            const githubUrl = `https://github.com/${GITHUB_USERNAME}/${REPO_NAME}/issues/new?title=${issueTitle}&body=${issueBody}`;
            window.open(githubUrl, '_blank');
            closeModal();
        }

        renderGrid();
    </script>
</body>
</html>
